<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Manual Test UI</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<!-- Single mount point: app.js is a thin hash router (specs.md §2.3) that
     mounts exactly one of launcher.js / workspace.js / inbox.js /
     project-inbox.js into this container, based on location.hash. Nothing
     else in this file names a screen-specific container anymore — that
     structure now lives inside each screen module. -->
<div id="app" class="app-root"></div>

<div id="toast" class="toast" hidden></div>

<!-- The same renderer the Node test suite drives; the client has no second
     implementation of it. Loaded as a classic (non-module) script, before
     app.js, so the global `PFMarkdown` it defines is already set by the
     time any module code (which document-rendering screens rely on) runs. -->
<script src="/lib/markdown.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
